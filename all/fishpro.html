    html, body { height: 100%; }

      position: absolute;
      inset: 0;
      display: block;
    }

<body>
  <h1 class="visuallyhidden">Fish Pro Screensaver - After Dark in the Browser</h1>

  <!-- fish is the original's Solo / Study Group / Class / School / University,
       and sea-floor its None / Static / Animated. The module's own description
       says to hit Caps Lock and watch the fish scatter, so that works too. -->

  <script src="ad.js?v=8363f11-260807091201"></script>
