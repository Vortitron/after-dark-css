<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marbles Screensaver | After Dark in the Browser</title>
  <meta name="description" content="After Dark's Marbles screensaver, running in the browser with the artwork decoded out of the original 1992 MARBLES2.AD module.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../img/favicon.png?v=fa6739b-260806154512" />
  <link rel="stylesheet" href="base.css?v=fa6739b-260806154512" />
  <style>
    html, body { height: 100%; }
    body { background: #000; margin: 0; overflow: hidden; }

    after-dark-marbles {
      position: absolute;
      inset: 0;
      display: block;
    }
  </style>
</head>
<body>
  <h1 class="visuallyhidden">Marbles Screensaver - After Dark in the Browser</h1>

  <!-- The original control panel's settings, by their own names:
       pins: none / few / many / lots     pin-size: x-small / medium / big
       speed: slow / medium / fast -->
  <after-dark-marbles art="art/marbles2" pins="many" pin-size="medium" speed="medium"></after-dark-marbles>

  <script src="ad.js?v=fa6739b-260806154512"></script>
  <script src="modules/marbles.js?v=fa6739b-260806154512"></script>
</body>
</html>
