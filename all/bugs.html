<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bugs Screensaver | After Dark in the Browser</title>
  <meta name="description" content="After Dark's Bugs, running in the browser with the artwork decoded out of the original BUGS.AD module.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../img/favicon.png?v=5019926-260807101742" />
  <link rel="stylesheet" href="base.css?v=5019926-260807101742" />
  <style>
    html, body { height: 100%; }
    body { background: #000; margin: 0; overflow: hidden; }

    after-dark-bugs {
      position: absolute;
      inset: 0;
      display: block;
    }
  </style>
</head>
<body>
  <h1 class="visuallyhidden">Bugs Screensaver - After Dark in the Browser</h1>

  <!-- density is the original's Nest / Colony / Infestation / Swarm / Plague /
       New York, and type its Bug Type list. clear-screen="no" leaves the canvas
       transparent, which is how they got onto your desktop. -->
  <after-dark-bugs art="art/bugs" density="infestation" type="all"></after-dark-bugs>

  <script src="ad.js?v=5019926-260807101742"></script>
  <script src="modules/bugs.js?v=5019926-260807101742"></script>
</body>
</html>
